<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48">
  <!-- Agentyllo icon: chat bubble carrying the concierge robot's face.
       On dark/indigo tiles: white bubble, ink head, indigo glowing eyes+smile. -->
  <defs>
    <radialGradient id="eyeG" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#c7d2fe"/><stop offset="60%" stop-color="#818cf8"/><stop offset="100%" stop-color="#6366f1"/>
    </radialGradient>
    <linearGradient id="faceG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e293b"/><stop offset="100%" stop-color="#0b1120"/>
    </linearGradient>
    <filter id="g" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="1.6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <path d="M11 4h26a8 8 0 0 1 8 8v18a8 8 0 0 1-8 8H21.5l-8.3 7.1c-1.4 1.2-3.6.2-3.6-1.7v-5.6A8 8 0 0 1 3 30V12a8 8 0 0 1 8-8z" fill="#fff"/>
