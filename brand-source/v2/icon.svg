    <rect x="38.8" y="19" width="4.6" height="10" rx="2.3" fill="#0f172a"/>
    <rect x="8" y="9" width="32" height="30" rx="12" fill="#0f172a"/>
    <rect x="12" y="14" width="24" height="20" rx="8.4" fill="url(#faceG)"/>
    <path d="M16.6 25.4 q 2.6 -3.4 5.2 0" stroke="url(#eyeG)" stroke-width="2.3" stroke-linecap="round" fill="none" filter="url(#g)"/>
    <path d="M26.2 25.4 q 2.6 -3.4 5.2 0" stroke="url(#eyeG)" stroke-width="2.3" stroke-linecap="round" fill="none" filter="url(#g)"/>
    <path d="M20.9 29.6 q 3.1 2.6 6.2 0" stroke="#818cf8" stroke-width="1.7" stroke-linecap="round" fill="none" filter="url(#g)"/>
