name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  php:
    name: PHP ${{ matrix.php }} — lint + unit tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: [ '8.2', '8.3', '8.4' ]
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, sodium, curl, json
          coverage: none
      - name: PHP lint (plugin + companion)
        run: |
          set -e
          for f in $(find agentyllo/src agentyllo-local-ai -name '*.php') agentyllo/agentyllo.php agentyllo/uninstall.php; do php -l "$f" >/dev/null; done
          echo "lint ok"
      - name: Composer install (dev)
        working-directory: agentyllo
        run: composer install --no-interaction --no-progress --prefer-dist
      - name: PHPUnit
        working-directory: agentyllo
        run: composer exec phpunit -- --colors=never

  js:
    name: JS build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Package (sanity)
        run: python3 tools/build-zip.py --no-build
      - uses: actions/upload-artifact@v4
        with:
          name: agentyllo-zips
          path: dist/*.zip
          retention-days: 7
