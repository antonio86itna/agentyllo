name: Release

on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: write

jobs:
  release:
    name: Build zips + GitHub Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
      - name: Verify tag matches plugin version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VER=$(grep -m1 "Version:" agentyllo/agentyllo.php | sed 's/.*Version:[[:space:]]*//' | tr -d '\r')
          test "$TAG" = "$VER" || { echo "Tag $TAG != plugin version $VER"; exit 1; }
      - run: npm ci
      - run: npm run build
      - run: python3 tools/build-zip.py --no-build
      - name: GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          generate_release_notes: true
